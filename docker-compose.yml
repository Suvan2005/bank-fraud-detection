version: '3.8'

services:
  api:
    build: .
    container_name: bank_fraud_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    container_name: bank_fraud_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    environment:
      - PYTHONUNBUFFERED=1

  mlflow:
    build: .
    container_name: bank_fraud_mlflow
    command: mlflow server --backend-store-uri file:./mlruns --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - .:/app
